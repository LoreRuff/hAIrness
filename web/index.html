<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI Harness</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0d1117" />
  <script>
    // Theme before first paint: no dark flash for light/black users. Mirrors
    // the token palettes in styles.css; main.tsx re-applies after prefs sync.
    (function () {
      var t = localStorage.getItem("harness_theme") || "dark";
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="theme-color"]').content =
        t === "light" ? "#f6f7f9" : t === "black" ? "#000000" : "#0d1117";
      // documentElement, not a <style> tag: there is none in this head.
      document.documentElement.style.background =
        t === "light" ? "#f6f7f9" : t === "black" ? "#000000" : "#0d1117";
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
